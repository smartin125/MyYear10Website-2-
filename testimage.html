<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Yesterday's Wikimedia Image</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #f5f1e8;
			--muted: #b9c0bc;
			--panel: rgba(20, 31, 34, 0.88);
			--line: rgba(245, 241, 232, 0.2);
			--accent: #f1b24a;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			color: var(--ink);
			background:
				radial-gradient(circle at 15% 15%, rgba(241, 178, 74, 0.18), transparent 28rem),
				linear-gradient(135deg, #111c22 0%, #203f3c 55%, #172328 100%);
			font-family: Georgia, 'Times New Roman', serif;
		}

		main {
			width: min(100%, 1100px);
			overflow: hidden;
			border: 1px solid var(--line);
			background: var(--panel);
			box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
		}

		.heading {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			align-items: end;
			padding: 1.6rem 2rem 1.25rem;
			border-bottom: 1px solid var(--line);
		}

		h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.7rem); font-weight: normal; }
		.eyebrow { margin: 0 0 0.35rem; color: var(--accent); font: 700 0.75rem/1.2 Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
		#date { margin: 0; color: var(--muted); font: 0.8rem Arial, sans-serif; text-align: right; }

		figure { margin: 0; }
		#image { width: 100%; max-height: 68vh; min-height: 260px; object-fit: contain; background: #0d1518; }
		#status { margin: 0; padding: 1.5rem 2rem; color: var(--muted); font: 0.9rem/1.5 Arial, sans-serif; }
		a { color: var(--accent); }

		@media (max-width: 600px) {
			body { padding: 0; }
			.heading, #status { padding-left: 1.2rem; padding-right: 1.2rem; }
			.heading { display: block; }
		}
	</style>
</head>
<body>
	<main>
		<header class="heading">
			<div>
				<p class="eyebrow">Wikimedia Commons</p>
				<h1>Image of the day</h1>
			</div>
		</header>

		<figure>
			<img id="image" alt="" hidden>
		</figure>
		<p id="status" role="status">Loading a random image from the archive...</p>
	</main>

	<script>
		const feedUrl = 'https://api.wikimedia.org/feed/v1/wikipedia/en/featured';
		const imageElement = document.querySelector('#image');
		const statusElement = document.querySelector('#status');
		const earliestDate = new Date(2004, 0, 1);

		function dateKey(date) {
			return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('/');
		}

		function dailySeed() {
			const today = new Date();
			return Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()) / 86400000;
		}

		function archivedDateForAttempt(attempt) {
			const yesterday = new Date();
			yesterday.setUTCHours(0, 0, 0, 0);
			yesterday.setUTCDate(yesterday.getUTCDate() - 1);
			const availableDays = Math.floor((yesterday - earliestDate) / 86400000);
			const seed = Math.abs(Math.sin((dailySeed() + attempt) * 12.9898) * 43758.5453);
			return new Date(earliestDate.getTime() + Math.floor((seed % 1) * availableDays) * 86400000);
		}

		function showImage(image) {
			const imageUrl = image.thumbnail?.source || image.image;
			imageElement.src = imageUrl;
			imageElement.alt = image.description || image.title;
			imageElement.onload = () => {
				imageElement.hidden = false;
				statusElement.hidden = true;
			};
			imageElement.onerror = () => {
				statusElement.hidden = false;
				statusElement.textContent = 'The selected image could not be displayed. Please refresh to try another one.';
			};
		}

		async function loadImage() {
			for (let attempt = 0; attempt < 5; attempt += 1) {
				const date = archivedDateForAttempt(attempt);
				try {
					const response = await fetch(`${feedUrl}/${dateKey(date)}`);
					if (!response.ok) throw new Error(`Wikimedia returned ${response.status}`);
					const data = await response.json();
					if (!data.image || (!data.image.thumbnail && !data.image.image)) throw new Error('The selected date has no image');
					showImage(data.image);
					return;
				} catch (error) {
					console.warn(`Could not load archive date ${dateKey(date)}`, error);
				}
			}
			statusElement.hidden = false;
			statusElement.textContent = 'The image could not be loaded. Please refresh to try another archived day.';
		}

		function scheduleMidnightRefresh() {
			const now = new Date();
			const nextMidnight = new Date(now);
			nextMidnight.setUTCHours(24, 0, 0, 0);
			setTimeout(() => {
				loadImage();
				scheduleMidnightRefresh();
			}, nextMidnight - now);
		}

		loadImage();
		scheduleMidnightRefresh();
	</script>
</body>
</html>
